# Clashborn — /etc/nginx/sites-available/clashborn.quest (D-278: nginx thay Caddy vì VPS đã có nginx).
# Chứng chỉ: certbot certonly --webroot -w /srv/clashborn/www -d clashborn.quest (tự gia hạn qua webroot).
# Thêm www: bỏ chú thích "www.clashborn.quest" ở hai server_name và xin lại chứng chỉ với -d www.clashborn.quest.

# D-287: game gửi báo cáo hiệu năng không cần mã → giới hạn mỗi IP 6 lần / phút (khối này nằm trong http {}).
limit_req_zone $binary_remote_addr zone=clashborn_report:1m rate=6r/m;
# D-331: game gửi biên bản trận (Clashborn Stats) không cần mã → mỗi IP 12 trận / phút.
limit_req_zone $binary_remote_addr zone=clashborn_match:1m rate=12r/m;
# D-333: tài khoản (đăng ký / đăng nhập / mã mail) → mỗi IP 30 lần / phút (chống dò mật khẩu, spam mail).
limit_req_zone $binary_remote_addr zone=clashborn_auth:1m rate=30r/m;
# D-401: máy chủ phòng khác (Singapore…) kiểm phiên người chơi qua /api/auth/me — mọi người chơi của máy đó chung MỘT IP →
# miễn giới hạn riêng cho /api/auth/me từ IP các máy đó (khóa rỗng = không đếm). Danh sách IP do update.sh ghi (phân giải
# tên máy chủ phòng lúc cập nhật) vào file include; các đường /api/auth/ khác vẫn giới hạn như cũ cho mọi IP.
geo $clashborn_rooms_peer {
    default 0;
    include /etc/nginx/clashborn-rooms-peers.conf;
}
map $clashborn_rooms_peer $clashborn_auth_me_key {
    0 $binary_remote_addr;
    1 "";
}
limit_req_zone $clashborn_auth_me_key zone=clashborn_auth_me:1m rate=30r/m;

server {
    listen 80;
    listen [::]:80;
    server_name clashborn.quest; # www.clashborn.quest

    location /.well-known/acme-challenge/ { root /srv/clashborn/www; }
    location / { return 301 https://clashborn.quest$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name clashborn.quest; # www.clashborn.quest

    ssl_certificate     /etc/letsencrypt/live/clashborn.quest/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/clashborn.quest/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    root /srv/clashborn/www;
    index index.html;
    disable_symlinks off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Kiểu file: dùng bảng chuẩn mime.types của nginx (khối http). KHÔNG đặt `types {}` ở đây — nó thay cả bảng,
    # file chưa liệt kê (.ico, .woff2, .ogg, .pck của bản web…) thành nhị phân. APK đặt riêng ở hai location dưới.

    # D-287: báo cáo hiệu năng từ game (máy chủ Python kiểm cỡ / dạng; đọc lại cần mã).
    location = /api/report {
        limit_req zone=clashborn_report burst=5 nodelay;
        limit_req_status 429;
        client_max_body_size 4m;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_pass http://127.0.0.1:8787;
    }

    # D-331: biên bản trận từ game (máy chủ Python kiểm dạng; trận dùng nút Test / quá ngắn bị bỏ).
    location = /api/match {
        limit_req zone=clashborn_match burst=10 nodelay;
        limit_req_status 429;
        client_max_body_size 64k;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_pass http://127.0.0.1:8787;
    }

    # D-401: kiểm phiên — máy chủ phòng khác (geo ở trên) không bị giới hạn; người chơi vẫn 30 / phút theo IP.
    location = /api/auth/me {
        limit_req zone=clashborn_auth_me burst=20 nodelay;
        limit_req_status 429;
        client_max_body_size 8k;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_pass http://127.0.0.1:8787;
    }

    # D-333: tài khoản người chơi (máy chủ Python: mật khẩu scrypt, khóa khi sai nhiều, mã mail hết hạn).
    location /api/auth/ {
        limit_req zone=clashborn_auth burst=20 nodelay;
        limit_req_status 429;
        client_max_body_size 8k;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_pass http://127.0.0.1:8787;
    }

    # Cổng nhận bản build → máy chủ Python chỉ nghe 127.0.0.1:8787 (kiểm mã bí mật).
    location /api/ {
        client_max_body_size 400m;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_pass http://127.0.0.1:8787;
    }

    # D-338: trận online — WebSocket vào máy chủ phòng (Godot không giao diện, 127.0.0.1:8790), giữ kết nối tới 1 giờ.
    location = /play {
        proxy_pass http://127.0.0.1:8790;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # version.json luôn mới (app hỏi mỗi lần mở); APK theo số bản thì cache lâu.
    location = /version.json { add_header Cache-Control "no-cache" always; }
    location /download/ {
        types { } default_type application/vnd.android.package-archive;
        add_header Cache-Control "no-cache" always;
        add_header Content-Disposition 'attachment; filename="clashborn.apk"' always;
    }
    location /releases/ {
        types { } default_type application/vnd.android.package-archive;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / { try_files $uri $uri/ =404; }
}
