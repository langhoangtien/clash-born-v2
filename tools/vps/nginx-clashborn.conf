# Clashborn — /etc/nginx/sites-available/clashborn.quest (D-278: nginx thay Caddy vì VPS đã có nginx).
# Chứng chỉ: certbot certonly --webroot -w /srv/clashborn/www -d clashborn.quest (tự gia hạn qua webroot).
# Thêm www: bỏ chú thích "www.clashborn.quest" ở hai server_name và xin lại chứng chỉ với -d www.clashborn.quest.

# D-287: game gửi báo cáo hiệu năng không cần mã → giới hạn mỗi IP 6 lần / phút (khối này nằm trong http {}).
limit_req_zone $binary_remote_addr zone=clashborn_report:1m rate=6r/m;
# D-331: game gửi biên bản trận (Clashborn Stats) không cần mã → mỗi IP 12 trận / phút.
limit_req_zone $binary_remote_addr zone=clashborn_match:1m rate=12r/m;

server {
    listen 80;
    listen [::]:80;
    server_name clashborn.quest; # www.clashborn.quest

    location /.well-known/acme-challenge/ { root /srv/clashborn/www; }
    location / { return 301 https://clashborn.quest$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name clashborn.quest; # www.clashborn.quest

    ssl_certificate     /etc/letsencrypt/live/clashborn.quest/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/clashborn.quest/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    root /srv/clashborn/www;
    index index.html;
    disable_symlinks off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Kiểu file: dùng bảng chuẩn mime.types của nginx (khối http). KHÔNG đặt `types {}` ở đây — nó thay cả bảng,
    # file chưa liệt kê (.ico, .woff2, .ogg, .pck của bản web…) thành nhị phân. APK đặt riêng ở hai location dưới.

    # D-287: báo cáo hiệu năng từ game (máy chủ Python kiểm cỡ / dạng; đọc lại cần mã).
    location = /api/report {
        limit_req zone=clashborn_report burst=5 nodelay;
        limit_req_status 429;
        client_max_body_size 4m;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_pass http://127.0.0.1:8787;
    }

    # D-331: biên bản trận từ game (máy chủ Python kiểm dạng; trận dùng nút Test / quá ngắn bị bỏ).
    location = /api/match {
        limit_req zone=clashborn_match burst=10 nodelay;
        limit_req_status 429;
        client_max_body_size 64k;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_pass http://127.0.0.1:8787;
    }

    # Cổng nhận bản build → máy chủ Python chỉ nghe 127.0.0.1:8787 (kiểm mã bí mật).
    location /api/ {
        client_max_body_size 400m;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_pass http://127.0.0.1:8787;
    }

    # version.json luôn mới (app hỏi mỗi lần mở); APK theo số bản thì cache lâu.
    location = /version.json { add_header Cache-Control "no-cache" always; }
    location /download/ {
        types { } default_type application/vnd.android.package-archive;
        add_header Cache-Control "no-cache" always;
        add_header Content-Disposition 'attachment; filename="clashborn.apk"' always;
    }
    location /releases/ {
        types { } default_type application/vnd.android.package-archive;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / { try_files $uri $uri/ =404; }
}
