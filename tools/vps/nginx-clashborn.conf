# Clashborn — /etc/nginx/sites-available/clashborn.quest (D-278: nginx thay Caddy vì VPS đã có nginx).
# Chứng chỉ: certbot certonly --webroot -w /srv/clashborn/www -d clashborn.quest (tự gia hạn qua webroot).
# Thêm www: bỏ chú thích "www.clashborn.quest" ở hai server_name và xin lại chứng chỉ với -d www.clashborn.quest.

server {
    listen 80;
    listen [::]:80;
    server_name clashborn.quest; # www.clashborn.quest

    location /.well-known/acme-challenge/ { root /srv/clashborn/www; }
    location / { return 301 https://clashborn.quest$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name clashborn.quest; # www.clashborn.quest

    ssl_certificate     /etc/letsencrypt/live/clashborn.quest/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/clashborn.quest/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    root /srv/clashborn/www;
    index index.html;
    disable_symlinks off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    types {
        text/html                              html;
        text/css                               css;
        application/javascript                 js;
        application/json                       json;
        image/png                              png;
        image/jpeg                             jpg jpeg;
        image/svg+xml                          svg;
        image/webp                             webp;
        application/wasm                       wasm;
        application/vnd.android.package-archive apk;
    }

    # Cổng nhận bản build → máy chủ Python chỉ nghe 127.0.0.1:8787 (kiểm mã bí mật).
    location /api/ {
        client_max_body_size 400m;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_pass http://127.0.0.1:8787;
    }

    # version.json luôn mới (app hỏi mỗi lần mở); APK theo số bản thì cache lâu.
    location = /version.json { add_header Cache-Control "no-cache" always; }
    location /download/ {
        add_header Cache-Control "no-cache" always;
        add_header Content-Disposition 'attachment; filename="clashborn.apk"' always;
    }
    location /releases/ { add_header Cache-Control "public, max-age=31536000, immutable" always; }

    location / { try_files $uri $uri/ =404; }
}
