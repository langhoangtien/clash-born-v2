# /etc/nginx/sites-available/sg.clashborn.quest — D-352: VPS Singapore chỉ có máy chủ phòng online.
# Khối 443 + chứng chỉ do `certbot --nginx -d sg.clashborn.quest` thêm vào SAU khi cài file này lần đầu;
# update_rooms.sh KHÔNG ghi đè file này (certbot đã sửa nó).
server {
    listen 80;
    listen [::]:80;
    server_name sg.clashborn.quest;

    # Trận online — WebSocket vào máy chủ phòng (Godot không giao diện, 127.0.0.1:8790), giữ kết nối tới 1 giờ.
    location = /play {
        proxy_pass http://127.0.0.1:8790;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Kiểm từ ngoài: commit máy chủ phòng đang chạy.
    location = /rooms-health {
        default_type text/plain;
        alias /srv/clashborn/rooms_deployed;
    }

    location / { return 404; }
}
